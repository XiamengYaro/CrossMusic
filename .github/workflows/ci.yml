name: CI

on:
  push:
    branches:
      - main
      - "optimize/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Build renderer
        run: npm run build
      - name: Install API dependencies
        run: npm ci --ignore-scripts
        working-directory: server
      - name: Check API JavaScript syntax
        run: |
          find module util plugins server.js generateConfig.js -type f -name '*.js' -print0 |
            xargs -0 -n 40 node --check
        working-directory: server

  # 打标签时先创建一个 draft release，供各平台打包任务向同一 Release 上传，
  # 避免多个平台并行发布时互相竞争创建 Release。
  prepare-release:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Create draft GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --draft --generate-notes \
            || gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" >/dev/null

  # 全平台构建：
  #   - 推送 main / 手动触发：构建并上传构建产物（不发布）
  #   - 推送 v* 标签：构建并把安装包发布到上述 draft Release
  package:
    needs: [quality, prepare-release]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --x64 --arm64
          - os: windows-latest
            args: --win --x64
          - os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Install API production dependencies
        run: npm ci --ignore-scripts
        working-directory: server
      - name: Build renderer
        run: npm run build
      - name: Install FUSE for AppImage (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && (sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2) || true
      - name: Package desktop application
        run: npx electron-builder --publish onTagOrDraft ${{ matrix.args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrossMusic-${{ matrix.os }}
          path: release/**
          if-no-files-found: error

  # 全部平台构建成功后，将 draft Release 转为正式发布
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release (draft -> latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --draft=false
